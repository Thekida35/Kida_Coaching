<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kida">

<title>Kida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f4f4f2;color:#0f1012;font-family:"Urbanist",-apple-system,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.box{width:100%;max-width:360px;text-align:center}
.av{width:104px;height:104px;border-radius:50%;padding:5px;margin:0 auto;background:conic-gradient(from 200deg,#b6a4fb,#b9dcf9,#cdeabb,#ffbf5e,#b6a4fb)}
.av svg{display:block;width:100%;height:100%;border-radius:50%}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:18px}
p{font-size:15px;color:#55585f;margin-top:6px;font-weight:500}
.dots{display:flex;justify-content:center;gap:12px;margin:28px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #0f1012;transition:background .15s}
.dots i.on{background:#0f1012}
.err{min-height:22px;color:#c63c2e;font-weight:600;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin-top:8px}
.pad button{width:76px;height:76px;border-radius:50%;border:0;background:#fff;font:600 28px "Urbanist",sans-serif;color:#0f1012;cursor:pointer}
.pad button:active{background:#b6a4fb}
.pad .ghost{background:transparent;font-size:15px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div class="box">
  <div class="av"><svg aria-hidden="true" viewBox="16 16 68 68">   <defs>     <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3dafe"/><stop offset="1" stop-color="#c9ddfb"/></linearGradient>     <radialGradient id="avSkin" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#f3cdae"/><stop offset="1" stop-color="#dfab86"/></radialGradient>     <linearGradient id="avLens" x1="0" x2="1"><stop offset="0" stop-color="#ff5a7a"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#7a5cff"/></linearGradient>     <linearGradient id="avCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e9ee"/></linearGradient>     <clipPath id="avClip"><circle cx="50" cy="50" r="50"/></clipPath>   </defs>   <g clip-path="url(#avClip)">     <rect width="100" height="100" fill="url(#avBg)"/>     <!-- t-shirt noir -->     <path d="M10 104c2-15 12-22 26-25l14 6 14-6c14 3 24 10 26 25z" fill="#16171b"/>     <path d="M71 86l7-2" stroke="#ffd35a" stroke-width="2" stroke-linecap="round"/><path d="M73 89l7-2" stroke="#7fd6c6" stroke-width="2" stroke-linecap="round"/>     <!-- cou -->     <path d="M42 66h16v14c-3 5-13 5-16 0z" fill="#d9a07b"/>     <path d="M36 79l14 7 14-7" fill="none" stroke="#2a2b31" stroke-width="2.5" stroke-linejoin="round"/>     <!-- oreilles -->     <ellipse cx="32.5" cy="53" rx="3.6" ry="5.4" fill="#e3b08c"/><ellipse cx="67.5" cy="53" rx="3.6" ry="5.4" fill="#e3b08c"/>     <!-- visage -->     <path d="M34 44c0-11 7-17 16-17s16 6 16 17v10c0 11-7 19-16 19s-16-8-16-19z" fill="url(#avSkin)"/>     <!-- barbe de 3 jours -->     <path d="M35.5 57c1 9 7 15.5 14.5 15.5S63.5 66 64.5 57c-2 4-5 5.5-8 5.5-2 0-3.5-1.5-6.5-1.5s-4.5 1.5-6.5 1.5c-3 0-6-1.5-8-5.5z" fill="#6b5446" opacity=".2"/>     <path d="M44 64.5c2-1 4-1.3 6-1.3s4 .3 6 1.3" fill="none" stroke="#6b5446" stroke-width="1.3" opacity=".35"/>     <!-- pattes -->     <path d="M34.3 47c0-3 .8-5.5 2-7.3v9.8z" fill="#2b1d16"/><path d="M65.7 47c0-3-.8-5.5-2-7.3v9.8z" fill="#2b1d16"/>     <!-- sourcils épais -->     <path d="M38.6 45.2c2.4-1.9 5.6-2.3 8.4-1.2" fill="none" stroke="#2b1d16" stroke-width="2.3" stroke-linecap="round"/>     <path d="M61.4 45.2c-2.4-1.9-5.6-2.3-8.4-1.2" fill="none" stroke="#2b1d16" stroke-width="2.3" stroke-linecap="round"/>     <!-- yeux -->     <ellipse cx="43.2" cy="49.6" rx="2.7" ry="1.9" fill="#fff"/><ellipse cx="56.8" cy="49.6" rx="2.7" ry="1.9" fill="#fff"/>     <circle cx="43.4" cy="49.7" r="1.55" fill="#5a3a22"/><circle cx="56.6" cy="49.7" r="1.55" fill="#5a3a22"/>     <circle cx="43.9" cy="49.2" r=".45" fill="#fff"/><circle cx="57.1" cy="49.2" r=".45" fill="#fff"/>     <path d="M40.4 48.6c1.6-1.4 4-1.6 5.8-.4M59.6 48.6c-1.6-1.4-4-1.6-5.8-.4" fill="none" stroke="#3a2a20" stroke-width=".8" stroke-linecap="round"/>     <!-- nez -->     <path d="M50.6 50.5c.4 3 1.4 5.6 2.4 7-1 .9-2.3 1.2-3.6.9" fill="none" stroke="#b8805e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>     <!-- bouche, petit sourire -->     <path d="M45.4 63.2c3 1.8 6.4 1.8 9.2-.2" fill="none" stroke="#a45f4a" stroke-width="1.5" stroke-linecap="round"/>     <!-- grain de beauté + taches de rousseur -->     <circle cx="44.2" cy="68.2" r=".75" fill="#6b4a38"/>     <g fill="#c88a64" opacity=".7"><circle cx="39.5" cy="54.5" r=".55"/><circle cx="41.8" cy="55.6" r=".45"/><circle cx="58.5" cy="54.8" r=".5"/><circle cx="60.8" cy="55.4" r=".45"/><circle cx="55" cy="40.5" r=".45"/></g>     <!-- casquette blanche -->     <path d="M32.5 42c0-11.5 7.5-19 17.5-19s17.5 7.5 17.5 19z" fill="url(#avCap)"/>     <path d="M50 23v19" stroke="#dcdce2" stroke-width=".8"/>     <g fill="#d9d9df"><circle cx="41" cy="30" r=".6"/><circle cx="43" cy="28.6" r=".6"/><circle cx="57" cy="28.6" r=".6"/><circle cx="59" cy="30" r=".6"/></g>     <path d="M30.5 42.3c6-2.1 12.5-3 19.5-3s13.5.9 19.5 3c-.6 1.5-2 2.2-3.4 1.9-5-1.1-10.5-1.6-16.1-1.6s-11.1.5-16.1 1.6c-1.4.3-2.8-.4-3.4-1.9z" fill="#f4f4f7" stroke="#d6d6dc" stroke-width=".6"/>     <!-- lunettes miroir posées sur la casquette -->     <path d="M37 31.8c3-1.4 8.8-1.6 11.4-.4.5 2.8-1 5-4.2 5.2-3.6.2-6.6-1.5-7.2-4.8z" fill="url(#avLens)" stroke="#16171b" stroke-width="1.1"/>     <path d="M63 31.8c-3-1.4-8.8-1.6-11.4-.4-.5 2.8 1 5 4.2 5.2 3.6.2 6.6-1.5 7.2-4.8z" fill="url(#avLens)" stroke="#16171b" stroke-width="1.1"/>     <path d="M48.4 31.6c1-.5 2.2-.5 3.2 0" fill="none" stroke="#16171b" stroke-width="1.1"/>     <path d="M39 32.6c1.5-.5 3-.6 4.2-.4" stroke="#fff" stroke-width=".8" stroke-linecap="round" opacity=".8"/>     <path d="M53.6 32.3c1.3-.3 2.6-.3 3.8 0" stroke="#fff" stroke-width=".8" stroke-linecap="round" opacity=".8"/>   </g> </svg> </div>
  <h1>Kida</h1>
  <p>Entre ton code pour ouvrir tes courses</p>
  <div class="dots" id="dots"></div>
  <div class="err" id="err" role="alert"></div>
  <div class="pad" id="pad"></div>
</div>
<script>
var LEN=6,code="",busy=false;
var dots=document.getElementById("dots"),pad=document.getElementById("pad"),err=document.getElementById("err");
function draw(){dots.innerHTML="";for(var i=0;i<LEN;i++){var d=document.createElement("i");if(i<code.length)d.className="on";dots.appendChild(d)}}
["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(function(k){var b=document.createElement("button");b.type="button";
  if(k===""){b.className="ghost";b.textContent="4 chiffres ?";b.onclick=function(){if(code.length>=4)send()};b.setAttribute("aria-label","Valider un code plus court")}
  else if(k==="⌫"){b.className="ghost";b.textContent="Effacer";b.onclick=function(){code=code.slice(0,-1);draw()}}
  else{b.textContent=k;b.onclick=function(){if(busy||code.length>=LEN)return;code+=k;err.textContent="";draw();if(code.length===LEN)send()}}
  pad.appendChild(b)});
document.addEventListener("keydown",function(e){if(/^\d$/.test(e.key)&&code.length<LEN){code+=e.key;draw();if(code.length===LEN)send()}else if(e.key==="Backspace"){code=code.slice(0,-1);draw()}else if(e.key==="Enter"&&code.length>=4)send()});
function send(){busy=true;fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(x){
  if(x.ok){location.replace("/");return}
  err.textContent=x.j.error||"Code incorrect.";code="";draw();dots.classList.remove("shake");void dots.offsetWidth;dots.classList.add("shake");busy=false})
  .catch(function(){err.textContent="Pas de connexion internet.";busy=false})}
draw();
</script>
</body></html>
