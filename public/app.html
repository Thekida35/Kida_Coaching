<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kida">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2">
<link rel="icon" href="/icons/icon-192.png?v=2">
<title>Kida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f2; --card:#ffffff; --soft:#efefeb; --line:#e8e8e4;
  --ink:#0f1012; --mid:#55585f; --dim:#8a8d94;
  --g1:#0f1012; --g2:#b6a4fb; --grn:#2f7d3a;
  --blu:#2a78ad; --vio:#6b4fd8; --amb:#b06a00; --red:#d8483a;
  --lav:#b6a4fb; --lav2:#e4dcfe; --orange:#ffbf5e; --sky:#b9dcf9; --butter:#f8e08e; --sage:#cdeabb; --rest:#cdeef2; --pink:#f5a9ec; --aqua:#bde6ef;
  --sh:none; --navsh:0 12px 30px -10px rgba(15,16,18,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)!important;min-height:100%}
body{background:var(--bg)!important;color:var(--ink);font-family:"Urbanist",-apple-system,system-ui,"Helvetica Neue",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:470px;margin:0 auto;min-height:100vh;padding:0 16px 130px;background:var(--bg)}

/* en-tête */
.top{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;padding:14px 0 4px}
.avw{width:52px;height:52px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#b6a4fb,#b9dcf9,#cdeabb,#ffbf5e,#b6a4fb)}
.avw svg{display:block;width:100%;height:100%;border-radius:50%}
.hc{text-align:center;min-width:0}
.ttl{font-size:17px;font-weight:600;line-height:1.2}
.hsub{display:block;font-size:14px;color:var(--mid);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnd{width:52px;height:52px;border-radius:50%;border:1.5px solid #dcdcd8;background:transparent;display:grid;place-items:center;position:relative;color:var(--ink)}
.rnd svg{width:22px;height:22px}
.rnd i{position:absolute;top:13px;right:14px;width:9px;height:9px;border-radius:50%;background:#ef6a55;border:2px solid var(--bg)}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:0;border-radius:999px;padding:10px 16px 10px 12px;font-weight:600;font-size:14px;color:var(--ink);min-height:44px}

/* titres de section */
h3{font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin:28px 2px 12px;display:flex;align-items:baseline;gap:8px;text-transform:none}
h3 .x{margin-left:auto;font-size:14.5px;color:var(--dim);font-weight:600;background:none;border:0}

/* hero (fiche course) */
.hero{margin-top:14px;border-radius:30px;padding:20px;color:var(--ink);position:relative;overflow:hidden;background:var(--lav)}
.hero.past{background:var(--sky)}
.hrow{display:flex;align-items:flex-start;gap:10px;position:relative;z-index:1}
.hero .lab{font-size:14px;opacity:.75;font-weight:600}
.hero .jj{font-size:56px;font-weight:600;line-height:1;letter-spacing:-.04em;margin-top:8px}
.hero .sub{font-size:15px;margin-top:6px;font-weight:500}
.chip{margin-left:auto;background:rgba(255,255,255,.6);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.inner{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:relative;z-index:1}
.ic{background:rgba(255,255,255,.72);border-radius:22px;padding:13px 14px;color:var(--ink);text-align:left;border:0}
.ic .k{font-size:12.5px;color:var(--mid);font-weight:600}
.ic .v{font-size:26px;font-weight:600;line-height:1.1;margin-top:3px;letter-spacing:-.02em}
.ic .s{font-size:12.5px;color:var(--mid);font-weight:500}
.hero .go{display:block;width:100%;margin-top:12px;position:relative;z-index:1;background:var(--ink);border:0;border-radius:999px;padding:14px;color:#fff;font-weight:600}
.medal{position:absolute;right:-26px;top:-12px;width:170px;height:205px;z-index:1;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.medal{animation:sway 6s ease-in-out infinite;transform-origin:60% 0}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* séance du jour */
.today{border-radius:32px;padding:20px 20px 18px;position:relative;overflow:hidden;transition:background .3s}
.today .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{background:rgba(255,255,255,.62);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.wxp{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;background:rgba(255,255,255,.62);border-radius:999px;padding:6px 12px}
.wxp svg{width:16px;height:16px}
.today .t{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:16px}
.today .d{font-size:15.5px;font-weight:500;line-height:1.5;margin-top:10px;color:#2a2b2f}
.today .wy{font-size:14px;font-weight:500;line-height:1.45;margin-top:8px;color:#3a3b40}
.acts{display:flex;gap:10px;margin-top:18px}
.done{flex:1;height:58px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .25s,color .25s}
.done .ck{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.done .ck svg{width:16px;height:16px}
.done[aria-pressed="true"]{background:rgba(255,255,255,.78);color:var(--ink)}
.done[aria-pressed="true"] .ck{background:var(--ink);color:#fff;transform:scale(1.08)}
.cb{width:58px;height:58px;border-radius:50%;border:0;background:rgba(255,255,255,.78);display:grid;place-items:center;flex:0 0 58px}
.cb svg{width:24px;height:24px}
.stamp{position:absolute;right:18px;top:64px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;transform:rotate(-8deg);opacity:0;transition:opacity .25s}
.today.is-done .stamp{opacity:.85}
.week{display:flex;gap:6px;margin:14px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.day{flex:0 0 50px;height:80px;border-radius:25px;border:1.5px solid #d4d4cf;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;gap:3px;position:relative;transition:background .2s,border-color .2s,color .2s}
.day .d{font-size:14px;color:var(--dim);font-weight:500}
.day .n{font-size:18px;font-weight:600}
.day .dot{position:absolute;top:12px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.day .ok{position:absolute;top:8px;width:15px;height:15px;border-radius:50%;background:var(--sage);display:grid;place-items:center}
.day .ok svg{width:9px;height:9px}
.day.on{background:var(--ink);border-color:var(--ink);color:#fff}
.day.on .d{color:#babcc2}.day.on .dot{background:#fff}
.day.race .dot{background:#ef6a55;width:8px;height:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini{border-radius:26px;padding:16px;min-height:128px;border:0;text-align:left}
.mini .k{font-size:13px;font-weight:600;opacity:.75}
.mini .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:8px;line-height:1.1;white-space:nowrap}
.mini .s{font-size:13.5px;font-weight:500;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ch3{font-size:28px;line-height:1.04;font-weight:700;letter-spacing:-.035em;max-width:66%;margin-top:6px;position:relative;z-index:2}
.hchips{display:flex;gap:6px;margin-top:16px;position:relative;z-index:2;flex-wrap:wrap;max-width:66%}
.hchips span{background:rgba(255,255,255,.55);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.hchips span.j{background:var(--ink);color:#fff}

/* coach accueil */
.coach{background:var(--card);border-radius:30px;padding:18px}
.cpage{margin-top:14px}
.cfacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cfacts>div{border-radius:20px;padding:12px 13px;min-width:0}
.cfacts u{display:block;text-decoration:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#3a3b40;opacity:.75}
.cfacts b{display:block;font-size:15px;font-weight:700;margin-top:3px;line-height:1.25}
.cfacts span{display:block;font-size:12.5px;font-weight:500;color:#3a3b40;margin-top:3px;line-height:1.35}
.coachbtn[disabled]{opacity:.5}
.cknows{font-size:13px;font-weight:500;color:var(--mid);line-height:1.45;margin-top:12px}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:2px}
#cform{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 6px 24px rgba(15,16,18,.12);z-index:2}
.coach .ct{display:flex;align-items:center;gap:12px}
.coach .ci2{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#b6a4fb,#b9dcf9);display:grid;place-items:center;flex:0 0 46px}
.coach .ci2 svg{width:22px;height:22px}
.coach .ct b{font-size:17px;font-weight:600;display:block}
.coach .ct span{font-size:13.5px;color:var(--mid);font-weight:500}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sug button{border:1.5px solid #e0e0dc;background:transparent;border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:600;color:#2a2b2f;min-height:40px}
.ask{display:flex;gap:8px;margin-top:12px;background:var(--bg);border-radius:999px;padding:6px 6px 6px 18px;align-items:center}
.ask input{flex:1;border:0;background:transparent;font-size:16px;font-weight:500;outline:none;min-width:0}
.ask input::placeholder{color:var(--dim)}
.ask button{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 46px}
.ask button svg{width:20px;height:20px}
.ans{margin-top:12px;font-size:14.5px;font-weight:500;line-height:1.5;background:#f1eefe;border-radius:18px 18px 18px 6px;padding:12px 14px;white-space:pre-wrap}
.ans.wait{color:var(--dim)}
.qq{margin-top:12px;font-size:14px;font-weight:600;text-align:right;color:var(--mid)}

/* blocs génériques */
.sess{background:var(--card);border-radius:26px;padding:17px 18px;display:flex;gap:14px;align-items:flex-start}
.sico{flex:0 0 46px;height:46px;border-radius:50%;background:var(--lav);display:grid;place-items:center}
.sico svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.why{font-size:14px;color:var(--mid);line-height:1.55;margin-top:10px;padding:0 4px;font-weight:500}
.why b{color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{border-radius:26px;padding:16px;background:var(--card)}
.grid .sc:nth-child(1){background:var(--sky)}.grid .sc:nth-child(2){background:var(--lav2)}.grid .sc:nth-child(3){background:var(--sage)}.grid .sc:nth-child(4){background:var(--butter)}
.sc .k{font-size:13px;color:var(--ink);opacity:.72;font-weight:600}
.sc .v{font-size:34px;font-weight:600;line-height:1.05;margin-top:6px;letter-spacing:-.03em;color:var(--ink)!important}
.sc .s{font-size:13px;font-weight:600;margin-top:4px;color:var(--ink)!important;opacity:.7}
.lc{background:var(--card);border-radius:28px;padding:4px 18px}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-height:52px}
.r:last-child{border-bottom:0}
.r .l{font-size:14.5px;color:var(--mid);font-weight:500}
.r .v{font-size:20px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.r .v.s{font-size:14.5px;font-weight:600;white-space:normal;text-align:right}
.r .v u{text-decoration:none;font-size:12px;color:var(--dim);font-weight:600;margin-left:6px}
.g{color:var(--grn)!important}.a{color:var(--amb)!important}.dm{color:var(--dim)!important}
.r.now{margin:0 -18px;padding:14px 18px;background:var(--soft)}
.r.now .l{color:var(--ink);font-weight:700}

/* cartes course */
.rc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:26px;padding:14px 16px}
.rc+.rc{margin-top:10px}
.rc:active{transform:scale(.985)}
.dt{flex:0 0 58px;height:64px;border-radius:26px;background:var(--soft);display:grid;place-content:center;text-align:center}
.dt b{font-size:19px;font-weight:700;line-height:1}
.dt span{white-space:nowrap;font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.rc.up{background:var(--lav)}
.rc.up .dt{background:var(--ink);color:#fff}
.rc.up .dt span{color:#babcc2}
.rc .nm{font-size:16px;font-weight:600;line-height:1.25}
.rc .mt{font-size:13px;color:var(--mid);font-weight:500;margin-top:2px}
.rc.up .mt{color:#3a3350}
.rc .rt{margin-left:auto;text-align:right;flex:0 0 auto}
.rc .rt b{display:block;font-size:18px;font-weight:700;letter-spacing:-.02em}
.rc.up .rt b{color:var(--ink)!important}
.rc .rt span{font-size:12px;color:var(--dim);font-weight:600}
.rc.up .rt span{color:#3a3350}
.pr{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-right:6px;vertical-align:1px;background:var(--soft);color:var(--mid)}
.pr.pA{background:var(--ink);color:#fff}
.block{background:var(--soft);border-radius:30px;padding:8px}

/* onglets fiche */
.tabs{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:5px;margin-top:14px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:11px 4px;font-weight:600;font-size:14px;color:var(--dim);min-height:44px}
.tabs button.on{background:var(--ink);color:#fff}

.objs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ob{background:var(--card);border:1.5px solid transparent;border-radius:26px;padding:14px 6px;text-align:center;color:var(--ink)}
.ob.on{background:var(--ink);color:#fff}
.ob .a1{font-size:12px;opacity:.6;font-weight:600}
.ob .b{font-size:24px;font-weight:600;margin-top:3px;letter-spacing:-.03em}
.ob.on .b{color:#fff}
.ob .c{font-size:12px;opacity:.65;font-weight:600}

.ph{display:grid;grid-template-columns:66px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border-bottom:0}
.ph .km{font-size:13px;font-weight:700;color:var(--vio);padding-top:3px}
.ph .p{font-size:19px;font-weight:600;letter-spacing:-.02em}
.ph .p u{text-decoration:none;font-size:12px;color:var(--dim);font-weight:600;margin-left:6px}
.ph .t{font-size:14px;color:var(--mid);margin-top:2px;font-weight:500;line-height:1.5}
.tl{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tl:last-child{border-bottom:0}
.tl .h{font-size:15px;font-weight:700}
.tl .w{font-size:15px;font-weight:600}
.tl .w small{display:block;font-size:13px;color:var(--mid);font-weight:500;margin-top:1px}
.tl.key .h,.tl.key .w{color:var(--vio)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--dim);font-weight:600;text-align:right;padding:0 0 9px}
th:first-child{text-align:left}
td{font-size:17px;font-weight:600;text-align:right;padding:11px 0;border-top:1px solid var(--line)}
td:first-child{text-align:left;font-size:14px;font-weight:500;color:var(--mid)}
tr.hi td{color:var(--vio)}
td+td,th+th{padding-left:14px}

.ci{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.42;font-weight:500;cursor:pointer}
.ci:last-child{border-bottom:0}
.bx{flex:0 0 24px;height:24px;border:2px solid #d4d4cf;border-radius:50%;margin-top:0;position:relative}
.ci.done .bx{background:var(--ink);border-color:var(--ink)}
.ci.done .bx::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.ci.done{opacity:.45}
.ci .d1{font-weight:700;color:var(--vio);margin-right:7px}
.cnt{margin-left:auto;font-size:15px;font-weight:600;color:var(--vio)}

.warn{border-radius:24px;padding:15px 16px;font-size:14px;margin-top:10px;line-height:1.5;font-weight:500;background:var(--butter)}
.warn b{color:var(--ink);font-weight:700}
.sx{padding:14px 0;border-bottom:1px solid var(--line)}
.sx:last-child{border-bottom:0}
.sx .t{font-size:16px;font-weight:600}
.sx .d{font-size:16px;color:var(--vio);font-weight:600;margin-top:3px}
.sx .w{font-size:13px;color:var(--dim);margin-top:2px;font-weight:500}
.empty{background:transparent;border:1.5px dashed #d4d4cf;border-radius:26px;padding:16px;font-size:14px;color:var(--mid);font-weight:500;line-height:1.5}
.empty b{color:var(--ink)}
.quote{background:var(--card);border-radius:26px;padding:16px 18px;font-size:15px;line-height:1.6;white-space:pre-line}
.big{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1}

.cc{background:var(--card);border-radius:28px;padding:18px 16px 12px}
.cc svg{display:block;width:100%;height:132px;overflow:visible}
.cx{display:flex;justify-content:space-between;margin-top:8px;padding:0 4px;font-size:12px;color:var(--dim);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:15px 18px;font-weight:600;font-size:15px;background:var(--ink);color:#fff;min-height:52px}
.btn.soft{background:var(--card);color:var(--ink)}
.btn.w{width:100%;margin-top:12px}
.btn[disabled]{opacity:.6}
.sheet-bg{position:fixed;inset:0;background:rgba(15,16,18,.4);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:470px;border-radius:32px 32px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:4px 4px 14px}
.fld{display:block;margin-bottom:11px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--mid);margin:0 6px 6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1.5px solid transparent;border-radius:18px;padding:13px 15px;font-weight:600;font-size:16px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--lav)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--navsh)}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin:4px 6px 0}

.coachbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;background:var(--card);border:0;border-radius:26px;padding:12px 14px;text-align:left}
.coachbtn b{font-size:15.5px;font-weight:600;display:block}
.coachbtn span{font-size:13px;color:var(--mid);font-weight:500}
.coachbtn i{flex:0 0 42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#b6a4fb,#b9dcf9);display:grid;place-items:center;color:var(--ink);font-style:normal;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{border-radius:20px;padding:12px 15px;font-size:15px;line-height:1.55;white-space:pre-wrap;max-width:92%}
.msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px}
.msg.bot{align-self:flex-start;background:#f1eefe;border-radius:20px 20px 20px 6px}
.msg.bot.wait{color:var(--dim)}
.chips[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1.5px solid #e0e0dc;background:var(--card);border-radius:999px;padding:9px 13px;font-size:13.5px;font-weight:600;color:#2a2b2f}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--grn);margin-left:auto;letter-spacing:0}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grn)}
.live.off{color:var(--dim)}.live.off::before{background:var(--dim)}
.shoe{padding:14px 0;border-bottom:1px solid var(--line)}
.shoe:last-child{border-bottom:0}
.shoe .top1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shoe .n{font-size:15px;font-weight:600}
.shoe .km{font-size:18px;font-weight:600;white-space:nowrap}
.shoe .km u{text-decoration:none;font-size:12px;color:var(--dim);font-weight:600;margin-left:4px}
.meter{height:8px;background:var(--soft);border-radius:4px;margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:1px}
.pill.warn2{background:var(--butter);color:#6b4a00}
.pill.crit{background:#fbd4cd;color:#a3301f}
.vd{position:relative}
.vd svg{display:block;width:100%;height:170px;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:600;line-height:1.35;white-space:nowrap;transform:translate(-50%,-110%)}
.tip[hidden]{display:none}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mid);font-weight:600;margin-top:8px;padding:0 4px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:9px;height:9px;border-radius:50%;background:var(--ink);display:inline-block}
.lg i.o{background:var(--card);border:2px solid var(--ink)}

/* plan timeline */
.pd{display:flex;gap:12px;align-items:stretch;border-radius:26px;padding:14px;margin-top:8px;cursor:pointer;transition:opacity .2s}
.pd .dd{flex:0 0 52px;border-radius:20px;background:rgba(255,255,255,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
.pd .dd span{font-size:12px;font-weight:600;color:var(--mid)}
.pd .dd b{font-size:20px;font-weight:700;line-height:1.1}
.pd .dd i{font-style:normal;font-size:11px;font-weight:700;color:var(--vio);margin-top:2px}
.pd .bd{flex:1;min-width:0}
.pd .ty{display:inline-block;background:rgba(255,255,255,.65);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pd .tt{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.25;margin-top:6px}
.pd .de{font-size:13.5px;font-weight:500;color:#3a3b40;line-height:1.45;margin-top:3px}
.pd .cc2{flex:0 0 34px;align-self:center;width:34px;height:34px;border-radius:50%;border:2px solid rgba(15,16,18,.25);display:grid;place-items:center;background:rgba(255,255,255,.5)}
.pd .cc2 svg{width:16px;height:16px;opacity:0}
.pd.fin .cc2{background:var(--ink);border-color:var(--ink);color:#fff}
.pd.fin .cc2 svg{opacity:1}
.pd.fin .tt{text-decoration:line-through;text-decoration-thickness:2px}
.pd.past:not(.fin){opacity:.6}
.pd.now{box-shadow:0 0 0 3px var(--ink)}
.pbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:22px;padding:14px 16px}
.pbar .m{flex:1;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.pbar .m i{display:block;height:100%;background:var(--ink);border-radius:5px}
.pbar b{font-size:15px;font-weight:600;white-space:nowrap}
/* barre d'onglets noire */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:438px;background:var(--ink);border-radius:999px;padding:6px;display:flex;justify-content:space-between;align-items:center;z-index:50;box-shadow:var(--navsh)}
nav button{width:62px;height:62px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center}
nav button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
nav button.on{background:#fff;color:var(--ink)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--vio);outline-offset:3px}

<script>
/* Kida : adaptateurs qui remplacent les connecteurs Claude par l'API de l'app. */
(function(){
function API(path,opt){opt=opt||{};return fetch(path,{method:opt.method||"GET",body:opt.body,signal:opt.signal,credentials:"same-origin",headers:{"Content-Type":"application/json"}}).then(function(r){
  if(r.status===401){location.href="/login";throw {code:"revoked"}}
  return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw {code:j.error||"unavailable",status:r.status};return j})})}
window.KidaAPI=API;
var cache=null,subs=[],started=false;

function sub(fn,err){var s={fn:fn,err:err};subs.push(s);
  if(!started){started=true;refresh();setInterval(refresh,60000);document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()})}
  else if(cache)setTimeout(fn,0);
  return function(){subs=subs.filter(function(x){return x!==s})}}
function docApi(path){var p=path.split("/"),base="/api/store/"+p[0]+"/"+p[1];return {
  onSnapshot:function(next,err){return sub(function(){var d=p[0]==="profile"?cache.me:(cache.races.filter(function(r){return r.id===p[1]})[0]||null);if(d){d=Object.assign({},d);delete d.id}next(snap(p[1],d))},err)},
  update:function(patch){return API(base,{method:"PATCH",body:JSON.stringify(patch)}).then(refresh)},
  set:function(data){return API(base,{method:"PUT",body:JSON.stringify(data)}).then(refresh)},
  "delete":function(){return API(base,{method:"DELETE"}).then(refresh)}}}
var db={doc:docApi,collection:function(c){return {doc:function(id){return docApi(c+"/"+id)},onSnapshot:function(next,err){return sub(function(){
  var docs=cache.races.map(function(r){var d=Object.assign({},r),id=d.id;delete d.id;return snap(id,d)});
  next({docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return []},metadata:{}})},err)}}}};
function route(s,t,i){i=i||{};var q=i.queryParams||{};
  if(s==="AccuWeather"&&t==="widgets-daily-claude")return "/api/weather?key="+encodeURIComponent(q.locationKey||"");
  if(s==="AccuWeather"&&t==="widgets-search-claude")return "/api/geocode?q="+encodeURIComponent(q.query||"");
  if(s==="Strava"&&t==="list_activities"){var u="/api/strava/activities?first="+(i.first||10);if(i.range_start)u+="&range_start="+encodeURIComponent(i.range_start);if(i.range_end)u+="&range_end="+encodeURIComponent(i.range_end);return u}
  if(s==="Strava"&&t==="get_gear")return "/api/strava/gear";
  return null}
function merr(e){return {code:e&&(e.code==="server_not_connected"||e.code==="revoked")?e.code:"server_unavailable",message:""}}
var mcp={callTool:function(s,t,i){var u=route(s,t,i);if(!u)return Promise.reject({code:"not_in_manifest"});return API(u).then(function(j){return {content:[],payload:j}},function(e){throw merr(e)})},
  watchTool:function(s,t,i,h,o){var u=route(s,t,i),dead=false;if(!u){setTimeout(function(){h({type:"error",error:{code:"not_in_manifest"}})});return function(){}}
    function run(){API(u).then(function(j){if(!dead)h({type:"data",result:{content:[],payload:j}})},function(e){if(!dead)h({type:"error",error:merr(e)})})}
    setTimeout(run,0);var iv=o&&o.refetchInterval?setInterval(run,Math.max(30000,o.refetchInterval)):null;
    return function(){dead=true;if(iv)clearInterval(iv)}}};
function sample(input,opts){opts=opts||{};var msgs=typeof input==="string"?[{role:"user",content:input}]:input;
  return API("/api/ai",{method:"POST",body:JSON.stringify({messages:msgs,json:!!opts._json,coach:opts.coach||null}),signal:opts.signal}).then(function(j){
    if(opts.onText)opts.onText({text:j.text,delta:j.text});return {text:j.text,truncated:!!j.truncated,modelTierApplied:"default"}},
    function(e){if(e&&e.name==="AbortError")throw {code:"cancelled",message:""};throw {code:(e&&e.code)||"upstream_error",message:""}})}
sample.json=function(input,opts){return sample(input,Object.assign({},opts,{_json:true,onText:null})).then(function(r){var t=r.text;try{return JSON.parse(t)}catch(e){var m=t.match(/[\{\[][\s\S]*[\}\]]/);if(m){try{return JSON.parse(m[0])}catch(e2){}}throw {code:"invalid_json",text:t}}})};

})();

function records(){var rec=(S.me&&S.me.records)||[];if(!rec.length)return '<div class="empty">Records à compléter.</div>';
  return '<div class="lc">'+rec.map(function(x){return '<div class="r"><span class="l">'+esc(x.k)+'</span><span class="v'+(x.s?"":" dm")+'">'+(x.s?esc(x.label||hms(x.s)):"à compléter")+(x.s&&x.km?'<u>'+pace(x.s,x.km)+'/km</u>':"")+(x.when?'<u>'+esc(x.when)+'</u>':"")+'</span></div>'}).join("")+'</div>'}

function todo(what){return '<div class="empty">'+what+' à compléter. <b>Demande à Claude</b> de remplir cette partie de la fiche.</div>'}

function tObj(r){var h="",w=r.weather;

function vdot(km,s){if(!km||!s)return null;var t=s/60,v=km*1000/t;

function progPoints(){return past().filter(function(r){return r.result&&r.result.s&&r.distanceKm>=3}).map(function(r){
  var steep=r.dplus&&r.distanceKm&&r.dplus/r.distanceKm>8;return {r:r,v:vdot(r.distanceKm,r.result.s),steep:steep}}).filter(function(p){return p.v}).sort(function(a,b){return a.r.date<b.r.date?-1:1})}
function vProg(){var P=progPoints();if(P.length<2)return "";
  var road=P.filter(function(p){return !p.steep}),best=road.length?road.reduce(function(a,b){return b.v>a.v?b:a}):null,n=upcoming()[0],h="";
  h+='<h3>Progression entre courses</h3><div class="cc vd"><svg id="vdc" viewBox="0 0 320 170" role="img" aria-label="Niveau VDOT par course"></svg><div class="tip" id="vtip" hidden></div>'+
    '<div class="lg"><span><i></i>route</span><span><i class="o"></i>trail, cross ou ultra (dénivelé, sous-estime ton niveau)</span></div></div>';
  if(best){h+='<div class="why">Le VDOT ramène chaque chrono à un niveau commun, quelle que soit la distance. Ton meilleur niveau sur route : <b>'+best.v.toFixed(1).replace(".",",")+'</b> ('+esc(best.r.name)+').';
    if(n&&n.distanceKm&&goalT(n)){var need=vdot(n.distanceKm,goalT(n));h+=' Ton objectif '+esc(n.goalSel||"B")+' au '+esc(n.name)+' demande <b>'+need.toFixed(1).replace(".",",")+'</b>'+(need>best.v?", soit +"+(need-best.v).toFixed(1).replace(".",",")+" : c'est un vrai palier.":", déjà atteint en course.")}
    h+='</div>'}
  h+='<div class="lc tw" style="padding:6px 18px;margin-top:11px"><table><tr><th>Course</th><th>Chrono</th><th>VDOT</th></tr>'+P.slice().reverse().map(function(p){return '<tr><td>'+esc(p.r.name)+(p.steep?' <span class="dm">· D+</span>':'')+'</td><td>'+hms(p.r.result.s)+'</td><td>'+p.v.toFixed(1).replace(".",",")+'</td></tr>'}).join("")+'</table></div>';
  return h}
function drawProg(){var el=$("vdc");if(!el)return;var P=progPoints(),W=320,H=170,L=34,Rr=12,T=16,B=26;
  var vs=P.map(function(p){return p.v}),lo=Math.floor(Math.min.apply(0,vs)-2),hi=Math.ceil(Math.max.apply(0,vs)+2);
  var t0=pd(P[0].r.date).getTime(),t1=pd(P[P.length-1].r.date).getTime()||t0+1;
  var x=function(p){return L+(pd(p.r.date).getTime()-t0)/((t1-t0)||1)*(W-L-Rr)},y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};
  var g="",step=Math.max(2,Math.round((hi-lo)/4));
  for(var v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--dim)" font-family="Urbanist,sans-serif">'+v+'</text>';
  var road=P.filter(function(p){return !p.steep}),d=road.map(function(p,i){return (i?"L":"M")+x(p)+" "+y(p.v)}).join(" ");
  var marks=P.map(function(p,i){return '<circle data-i="'+i+'" cx="'+x(p)+'" cy="'+y(p.v)+'" r="5" fill="'+(p.steep?"var(--card)":"var(--g1)")+'" stroke="'+(p.steep?"var(--g1)":"var(--card)")+'" stroke-width="2"/>'}).join("");

  var tip=$("vtip");function show(e){var i=+e.target.dataset.i,p=P[i],box=el.getBoundingClientRect();

    var a=A[0],m=a.summary;
    $("imp").innerHTML='<b>'+esc(a.name)+'</b><br>'+(m.distance/1000).toFixed(2).replace(".",",")+' km · '+hms(m.elapsed_time)+' ('+pace(m.elapsed_time,m.distance/1000)+'/km)'+((a.activity_tags||[]).indexOf("Race")>=0?' · marquée « course »':'')+'<br><span class="dm">Chrono = temps écoulé Strava. Corrige-le ensuite avec ton temps officiel si besoin.</span>';
    var ok=$("iok");ok.disabled=false;ok.onclick=function(){var result=Object.assign({},r.result,{s:m.elapsed_time,strava:a.description||"",stravaId:String(a.id)});
      r.result=result;r.status="done";L.innerHTML="";render();write(r.id,{result:result,status:"done"});toast("Résultat importé")};
  }).catch(function(e){$("imp").textContent=stravaMsg(e&&e.code)});
}

/* ── génération de fiche par Claude ── */
function genPrompt(r){var f=(S.me||{}).forme||{},rec=((S.me||{}).records||[]).filter(function(x){return x.s}).map(function(x){return x.k+" "+(x.label||hms(x.s))}).join(", ");
  var start=addDays(r.date,-13);if(start<todayKey())start=todayKey();
  return "Tu es entraîneur de course à pied. Prépare la fiche complète de la course de Killian. Réponds UNIQUEMENT par un objet JSON.\n\n"+
  "Course : "+r.name+", le "+r.date+(r.time?" à "+r.time:"")+", "+(r.distanceKm||"?")+" km, D+ "+(r.dplus||0)+" m, lieu : "+(r.place||"?")+", priorité "+(r.priority||"B")+".\n"+
  "Objectif chrono B : "+(goalT(r)?hms(goalT(r)):"à proposer")+".\nRecords : "+rec+".\nForme ("+(f.asOf||"?")+") : condition "+f.condition+", fatigue "+f.fatigue+", fraîcheur "+f.tsb+". Seuil ~3:44/km, FC max 196, zones FC Z2 126-156, Z3 157-172, Z4 173-187.\n"+
  "Contraintes : militaire (footing régimentaire fréquents le matin, gardes possibles), gêne ischio droit par le passé, Achille à ménager (pas de sprints), 1-2 jours de repos par semaine, affûtage adapté à la distance. Domicile : Saint-Aubin-du-Cormier (35), déplacement en voiture.\n\n"+
  "Schéma JSON attendu :\n{\"goals\":[{\"k\":\"A\",\"s\":secondes},{\"k\":\"B\",\"s\":secondes},{\"k\":\"C\",\"s\":secondes}],"+
  "\"racePlan\":[{\"km\":\"Km 1\",\"seg\":\"start|mid|end\",\"tag\":\"repère court (FC…)\",\"text\":\"consigne\"}] (3 à 5 portions),\"racePlanNote\":\"…\","+
  "\"plan\":[{\"date\":\"AAAA-MM-JJ\",\"title\":\"…\",\"detail\":\"allures, durée\",\"why\":\"une phrase\"}] (un jour par date, du "+start+" au "+r.date+" inclus),\"planNote\":\"…\","+
  "\"day\":[{\"h\":\"HH:MM\",\"w\":\"action\",\"small\":\"détail\",\"key\":true|false}],\"eve\":[{\"h\":\"…\",\"w\":\"…\",\"small\":\"…\"}],"+
  "\"bag\":[\"objet\"],\"dayInfo\":[{\"l\":\"repère\",\"v\":\"valeur\"}],\"dayNote\":[\"titre court.\",\"phrase\"]}\n"+
  "Tout en français. Les secondes sont des entiers. N'invente pas de détails sur le parcours que tu ne connais pas."}
function genFiche(){var r=race(S.raceId);if(!r||!S.sample)return;var btn=document.querySelector("[data-gen]");if(btn){btn.disabled=true;btn.textContent="Claude prépare la fiche… (jusqu'à une minute)"}
  S.sample.json(genPrompt(r),{cache:false}).then(function(j){
    if(!j||typeof j!=="object")throw {code:"invalid_json"};
    var patch={},arr=function(k){return Array.isArray(j[k])&&j[k].length};
    if(arr("goals")&&j.goals.every(function(g){return g&&g.k&&+g.s>0}))patch.goals=j.goals.map(function(g){return {k:String(g.k),s:Math.round(+g.s)}});
    if(arr("plan"))patch.plan=j.plan.filter(function(p){return p&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)&&p.title}).map(function(p){return {date:p.date,title:String(p.title),detail:String(p.detail||""),why:String(p.why||"")}});
    ["racePlan","day","eve","dayInfo"].forEach(function(k){if(arr(k))patch[k]=j[k]});
    if(arr("bag"))patch.bag=j.bag.map(String);
    ["racePlanNote","planNote"].forEach(function(k){if(typeof j[k]==="string")patch[k]=j[k]});
    if(Array.isArray(j.dayNote)&&j.dayNote.length===2)patch.dayNote=j.dayNote.map(String);
    if(!Object.keys(patch).length)throw {code:"invalid_json"};
    if(!r.goalSel)patch.goalSel="B";patch.generated=todayKey();
    Object.assign(r,patch);render();write(r.id,patch);toast("Fiche générée");
  }).catch(function(e){var c=e&&e.code;toast(c==="not_granted"||c==="sampling_disabled"?"Claude n'est pas autorisé sur cette page.":c==="rate_limited"?"Trop de demandes : réessaie dans quelques minutes.":"La génération a échoué, réessaie.");render()})}
function genBtn(r){return S.sample&&r.status!=="done"&&days(r.date)>=0?'<button class="btn w" data-gen="1" style="margin-top:0;margin-bottom:4px">'+((r.plan||[]).length?"Regénérer la fiche avec Claude":"Générer la fiche complète avec Claude")+'</button>':""}

/* ── réglages (cloche) ── */
function b64u(s){var p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function isStandalone(){return window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches}
async function pushState(){try{if(!("serviceWorker" in navigator)||!("PushManager" in window))return "unsupported";var r=await navigator.serviceWorker.ready;return (await r.pushManager.getSubscription())?"on":"off"}catch(e){return "unsupported"}}
async function enablePush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){toast(isStandalone()?"Ton iPhone ne gère pas les notifications web (iOS 16.4 minimum).":"Ajoute d'abord Kida à l'écran d'accueil, puis ouvre-la depuis l'icône.");return}
  var perm=await Notification.requestPermission();if(perm!=="granted"){toast("Notifications refusées. Tu peux les réactiver dans Réglages → Notifications → Kida.");return}
  var k=await window.KidaAPI("/api/push/key");if(!k.key){toast("Les clés de notification ne sont pas encore configurées sur Vercel.");return}
  var reg=await navigator.serviceWorker.ready;var s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)});
  await window.KidaAPI("/api/push/subscribe",{method:"POST",body:JSON.stringify(s)});toast("Brief activé : chaque matin à 6 h 45");settingsSheet()}
async function disablePush(){try{var reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s){await window.KidaAPI("/api/push/subscribe",{method:"DELETE",body:JSON.stringify({endpoint:s.endpoint})});await s.unsubscribe()}}catch(e){}toast("Brief désactivé");settingsSheet()}
async function settingsSheet(){var L=$("layer");
  L.innerHTML='<div class="sheet-bg"><div class="sheet"><h2>Réglages</h2><div class="lc" id="setl"><div class="r"><span class="l">Chargement…</span></div></div><div class="row2" style="margin-top:12px"><button type="button" class="btn soft" id="lo">Se déconnecter</button><button type="button" class="btn" id="sc">Fermer</button></div></div></div>';
  $("sc").onclick=function(){L.innerHTML=""};L.querySelector(".sheet-bg").onclick=function(e){if(e.target===this)L.innerHTML=""};
  $("lo").onclick=function(){window.KidaAPI("/api/logout",{method:"POST"}).finally(function(){location.href="/login"})};
  var st={};try{st=await window.KidaAPI("/api/strava/status")}catch(e){}
  var ps=await pushState(),el=$("setl");if(!el)return;
  el.innerHTML='<div class="r"><span class="l">Strava</span><span class="v s">'+(st.connected?'<span class="g">Connecté'+(st.athlete?' · '+esc(st.athlete):'')+'</span>':st.configured?'<a class="btn" style="min-height:40px;padding:9px 14px;text-decoration:none" href="/api/strava/connect">Connecter</a>':'<span class="dm">Codes Strava absents sur Vercel</span>')+'</span></div>'+
    '<div class="r"><span class="l">Brief du matin<br><small class="dm" style="font-size:12.5px">6 h 45, 10 jours avant une course</small></span><span class="v s">'+(ps==="on"?'<button class="btn soft" style="min-height:40px;padding:9px 14px;background:var(--soft)" id="pt">Tester</button> <button class="btn soft" style="min-height:40px;padding:9px 14px;background:var(--soft)" id="pd">Couper</button>':ps==="off"?'<button class="btn" style="min-height:40px;padding:9px 14px" id="pe">Activer</button>':'<span class="dm">'+(isStandalone()?"Non pris en charge":"Ouvre Kida depuis l'écran d'accueil")+'</span>')+'</span></div>';
  if($("pe"))$("pe").onclick=enablePush;if($("pd"))$("pd").onclick=disablePush;
  if($("pt"))$("pt").onclick=function(){window.KidaAPI("/api/push/test",{method:"POST"}).then(function(r){toast(r.sent?"Notification envoyée":"Aucun appareil n'a reçu la notification")}).catch(function(){toast("Échec de l'envoi")})};
}
(function(){var q=new URLSearchParams(location.search).get("strava");if(!q)return;history.replaceState(null,"","/");
  setTimeout(function(){toast(q==="ok"?"Strava connecté":q==="config"?"Il manque les codes Strava sur Vercel":"Connexion Strava annulée")},600)})();

/* ── interactions ── */
function bind(){
  document.querySelectorAll("[data-race]").forEach(function(b){b.onclick=function(){go("race",b.dataset.race)}});
  document.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(){go(b.dataset.nav)}});
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;render()}});
  document.querySelectorAll("[data-add]").forEach(function(b){b.onclick=addSheet});
  document.querySelectorAll("[data-result]").forEach(function(b){b.onclick=resultSheet});
  document.querySelectorAll("[data-coach]").forEach(function(b){b.onclick=function(){var id=S.raceId;go("coach");S.coachRace=id;render()}});
  document.querySelectorAll("[data-cq]").forEach(function(b){b.onclick=function(){askCoach(b.dataset.cq)}});
  document.querySelectorAll("[data-lastrun]").forEach(function(b){b.onclick=lastRun});
  document.querySelectorAll("[data-notes]").forEach(function(b){b.onclick=notesSheet});
  var cf=$("cform");if(cf)cf.onsubmit=function(e){e.preventDefault();if(S.cctl){S.cctl.abort();return}var q=$("cq").value.trim();if(q)askCoach(q)};
  document.querySelectorAll("[data-day]").forEach(function(b){b.onclick=function(){S.dayIdx=+b.dataset.day;render()}});
  document.querySelectorAll("[data-dayd]").forEach(function(b){b.onclick=function(){var n=upcoming()[0];(n.plan||[]).forEach(function(q,i){if(q.date===b.dataset.dayd)S.dayIdx=i});render();scrollTo({top:0,behavior:"smooth"})}});
  document.querySelectorAll("[data-goplan]").forEach(function(b){b.onclick=function(){go("race",b.dataset.goplan,"plan")}});
  document.querySelectorAll("[data-done]").forEach(function(b){b.onclick=function(){var n=upcoming()[0];if(!n)return;var i=b.dataset.done;
    n.checks=Object.assign({},n.checks);n.checks.tap=Object.assign({},n.checks.tap);n.checks.tap[i]=!n.checks.tap[i];
    var patch={checks:{tap:{}}};patch.checks.tap[i]=n.checks.tap[i];render();write(n.id,patch);if(n.checks.tap[i])toast("Bien joué, séance cochée")}});
  document.querySelectorAll("[data-import]").forEach(function(b){b.onclick=importSheet});
  document.querySelectorAll("[data-gen]").forEach(function(b){b.onclick=genFiche});
  if(S.view==="forme"){watchStrava();drawProg()}
  if(S.view==="race"){var rr=race(S.raceId);if(rr)watchWx(rr)}
  document.querySelectorAll("[data-goal]").forEach(function(b){b.onclick=function(){var r=race(S.raceId);if(!r)return;r.goalSel=b.dataset.goal;render();write(r.id,{goalSel:r.goalSel})}});
  document.querySelectorAll(".ci[data-ck],.pd[data-ck]").forEach(function(c){
    var t=function(){var r=race(S.raceId);if(!r)return;var g=c.dataset.ck,i=c.dataset.i;r.checks=Object.assign({},r.checks);r.checks[g]=Object.assign({},r.checks[g]);
      r.checks[g][i]=!r.checks[g][i];var patch={checks:{}};patch.checks[g]={};patch.checks[g][i]=r.checks[g][i];render();write(r.id,patch)};
    c.onclick=t;c.onkeydown=function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();t()}}});
  drawSeuil();
}
var pending=Promise.resolve();
function write(id,patch){pending=pending.then(function(){return S.db.doc("races/"+id).update(patch)}).catch(function(e){toast(e&&e.code==="invalid_argument"?"Modification refusée : tu n'as pas les droits d'écriture.":"Échec de l'enregistrement, réessaie.")})}

function sheet(html,onOk){var L=$("layer");L.innerHTML='<div class="sheet-bg"><form class="sheet" id="sf" novalidate>'+html+'<p class="err" id="serr"></p><div class="row2" style="margin-top:12px"><button type="button" class="btn soft" id="scancel">Annuler</button><button type="submit" class="btn" id="sok">Enregistrer</button></div></form></div>';
  $("scancel").onclick=function(){L.innerHTML=""};
  L.querySelector(".sheet-bg").onclick=function(e){if(e.target===this)L.innerHTML=""};
  $("sf").onsubmit=function(e){e.preventDefault();var msg=onOk();if(msg){$("serr").textContent=msg;return}L.innerHTML=""};
  var f=L.querySelector("input");if(f)f.focus()}
function fld(id,label,type,val,ph){return '<label class="fld"><span>'+label+'</span><input id="'+id+'" type="'+type+'" value="'+esc(val||"")+'" placeholder="'+esc(ph||"")+'"></label>'}
function slug(s){return (s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"course").slice(0,40)}

function addSheet(){
  sheet('<h2>Nouvelle course</h2>'+fld("f-name","Nom","text","","Semi de Vannes")+
    '<div class="row2">'+fld("f-date","Date","date","")+fld("f-time","Heure de départ","time","")+'</div>'+
    '<div class="row2">'+fld("f-km","Distance (km)","number","","21.1")+fld("f-dp","D+ (m)","number","","")+'</div>'+
    fld("f-place","Lieu","text","","Vannes")+
    '<div class="row2"><label class="fld"><span>Priorité</span><select id="f-pr"><option value="A">A · objectif</option><option value="B" selected>B · préparation</option><option value="C">C · plaisir</option></select></label>'+
    fld("f-goal","Objectif chrono","text","","1:20:00")+'</div>',
  function(){var name=$("f-name").value.trim(),date=$("f-date").value,kmv=parseFloat(String($("f-km").value).replace(",",".")),g=parseT($("f-goal").value);
    if(!name)return "Donne un nom à la course.";if(!date)return "Choisis la date de la course.";
    if($("f-km").value&&!(kmv>0))return "La distance doit être un nombre de kilomètres, par exemple 21.1.";
    if(isNaN(g))return "Écris le chrono au format h:mm:ss ou mm:ss, par exemple 1:20:00.";
    var id=slug(name)+"-"+date.slice(0,4),doc={id:id,name:name,date:date,time:$("f-time").value||"",distanceKm:kmv||null,dplus:+$("f-dp").value||null,
      place:$("f-place").value.trim(),priority:$("f-pr").value,status:"upcoming",goalSel:"B",
      goals:g?[{k:"A",s:Math.round(g*0.99)},{k:"B",s:g},{k:"C",s:Math.round(g*1.015)}]:[],checks:{}};
    var place=doc.place;
    (S.mcp&&place?S.mcp.callTool("AccuWeather","widgets-search-claude",{queryParams:{query:place}}).then(function(res){var p=res&&res.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){p=null}}
      var k=p&&p.results&&p.results[0]&&p.results[0].locationKey;if(k)doc.weather={locationKey:String(k)}}).catch(function(){}):Promise.resolve())
    .then(function(){return S.db.doc("races/"+id).set(doc)}).then(function(){toast("Course ajoutée");go("race",id)}).catch(function(e){toast(e&&e.code==="quota_exceeded"?"La base est pleine : supprime des courses anciennes.":"Échec de l'ajout, réessaie.")});
    return ""});
}
function resultSheet(){var r=race(S.raceId);if(!r)return;var res=r.result||{};
  sheet('<h2>Résultat · '+esc(r.name)+'</h2>'+
    '<div class="row2">'+fld("r-t","Chrono","text",res.s?hms(res.s):"","37:02")+fld("r-p","Classement","text",res.place||"","112e / 3 400")+'</div>'+
    fld("r-hr","FC moyenne","number",res.avgHr||"","")+
    '<label class="fld"><span>Bilan</span><textarea id="r-b" rows="4" placeholder="Ce qui a marché, ce qui a coincé">'+esc(r.bilan||"")+'</textarea></label>',
  function(){var t=parseT($("r-t").value);if(!t||isNaN(t))return "Écris le chrono au format h:mm:ss ou mm:ss, par exemple 37:02.";
    var result=Object.assign({},res,{s:t,place:$("r-p").value.trim(),avgHr:+$("r-hr").value||null});
    r.result=result;r.bilan=$("r-b").value.trim();r.status="done";render();
    write(r.id,{result:result,bilan:r.bilan,status:"done"});toast("Résultat enregistré");return ""});
}

/* ── data ── */
(async function(){
  var db=null;try{db=await window.claude.use("db")}catch(e){}
  if(!db){S.failed=true;render();return}
  S.db=db;var got=0;
  window.claude.use("mcp").then(function(m){S.mcp=m;if(m&&S.ok)render()}).catch(function(){});
  window.claude.use("sample").then(function(sm){S.sample=sm;if(sm&&S.ok)render()}).catch(function(){});
  function ready(){if(++got>=2&&!S.ok){S.ok=true}if(S.ok)render()}
  db.collection("races").onSnapshot(function(q){S.races=q.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});if(S.ok)render();else ready()},function(){S.failed=true;render()});
  db.doc("profile/me").onSnapshot(function(d){S.me=d.exists?d.data():null;if(S.ok)render();else ready()},function(){if(!S.ok)ready()});
})();
})();
</script>
