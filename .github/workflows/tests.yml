# Vérifie chaque modification avant la mise en ligne : types, tests du serveur (vitest) et de l'interface (Playwright).
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next-env.d.ts (ignoré par git, créé par next dev/build) apporte les types propres à Next
      - run: echo '/// <reference types="next" />' > next-env.d.ts && npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
